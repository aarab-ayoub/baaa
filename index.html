<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>42 rank</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header>
  <a href="#" class="brand">42 rank</a>
  <nav id="nav" hidden>
    <a href="#" id="nav-rank">Ranking</a>
    <a href="#transfers" id="nav-transfers">Transfers</a>
    <a href="#calc" id="nav-calc">Calculator</a>
    <span id="me" class="me"></span>
  </nav>
</header>

<section id="view-login" class="login" hidden>
  <h1>Where do you stand?</h1>
  <a class="btn" href="/auth/login">Continue with 42 <span aria-hidden="true">→</span></a>
  <p id="login-msg" class="err"></p>
</section>

<section id="view-rank" hidden>
  <div class="bar">
    <select id="campus" aria-label="campus"></select>
    <select id="promo" aria-label="promo"></select>
    <select id="coal" aria-label="coalition"></select>
    <select id="status" aria-label="status">
      <option value="active">Active</option>
      <option value="absorbed">Blackholed</option>
    </select>
    <form id="find"><input id="q" type="search" placeholder="Search a login" maxlength="32" autocomplete="off" spellcheck="false" aria-label="search a login"></form>
  </div>

  <div class="sub">
    <span id="msg" class="muted">loading…</span>
    <span id="fetched" class="muted right"></span>
  </div>

  <table id="tbl" hidden><thead></thead><tbody></tbody></table>
  <div id="pages" class="pages"></div>
</section>

<section id="view-transfers" hidden>
  <div class="bar">
    <select id="tr-campus" aria-label="campus"></select>
    <select id="tr-from" aria-label="origin"></select>
    <select id="tr-to" aria-label="destination"></select>
    <select id="tr-status" aria-label="status"></select>
    <select id="tr-promo" aria-label="promo"></select>
    <form id="tr-find"><input id="tr-q" type="search" placeholder="Search a login" maxlength="32" autocomplete="off" spellcheck="false" aria-label="search a login"></form>
  </div>

  <div class="sub">
    <span id="tr-msg" class="muted">loading…</span>
    <span id="tr-fetched" class="muted right"></span>
  </div>

  <div class="scroll"><table id="tr-tbl" hidden><thead></thead><tbody></tbody></table></div>
  <div id="tr-pages" class="pages"></div>
</section>

<section id="view-calc" hidden>
  <div class="hero">
    <div class="hero-line">
      <input id="cur" class="lvl-input" type="text" value="0.00" maxlength="5" inputmode="decimal" autocomplete="off" spellcheck="false" aria-label="current level">
      <span class="hero-arrow" aria-hidden="true">→</span>
      <span id="end" class="lvl-end">0.00</span>
    </div>
    <div class="track" aria-hidden="true"><div id="track-now" class="track-now"></div><div id="track-add" class="track-add"></div></div>
    <p class="hero-sub"><span id="gain" class="gain"></span><span id="track-text"></span></p>
    <form id="fill" class="fill"><input id="fill-q" type="search" placeholder="use another login's level" maxlength="32" autocomplete="off" spellcheck="false" aria-label="use another login's level"></form>
    <p id="fill-msg" class="muted small"></p>
  </div>

  <div class="adder">
    <div class="picker">
      <input id="proj" type="search" placeholder="Add a project" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="proj-results" aria-autocomplete="list" aria-label="add a project">
      <ul id="proj-results" class="results" role="listbox" hidden></ul>
    </div>
    <div class="adder-opts">
      <div class="marks" role="group" aria-label="mark">
        <button type="button" class="seg" data-mark="100">100</button>
        <button type="button" class="seg" data-mark="115">115</button>
        <button type="button" class="seg" data-mark="125">125</button>
        <input id="mark" class="seg-input" type="number" min="0" max="125" step="1" placeholder="other" aria-label="other mark">
      </div>
      <label class="pill-toggle" title="+4.2% xp when your coalition is 1st on your campus at the moment the project is validated">
        <input id="bonus" type="checkbox"><span>Coalition 1st +4.2%</span>
      </label>
    </div>
  </div>
  <p id="add-msg" class="muted small"></p>

  <ul id="picked" class="picked"></ul>
  <div class="picked-foot" id="picked-foot" hidden>
    <button type="button" class="link small-link" id="clear">clear all</button>
  </div>
  <p id="empty" class="empty muted">Add a project to see where it takes you.</p>
</section>

</body>
</html>
